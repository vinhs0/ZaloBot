apiVersion: apps/v1
kind: Deployment
metadata:
  name: zalo-chatbot
spec:
  replicas: 1 # keep at 1: a single Zalo session can't be listened to from multiple pods
  selector:
    matchLabels:
      app: zalo-chatbot
  template:
    metadata:
      labels:
        app: zalo-chatbot
    spec:
      containers:
        - name: zalo-chatbot
          image: zalo-chatbot:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: zalo-chatbot-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: zalo-chatbot
spec:
  selector:
    app: zalo-chatbot
  ports:
    - port: 80
      targetPort: 8000
